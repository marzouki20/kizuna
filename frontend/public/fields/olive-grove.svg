<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="soil" x2="0" y2="1">
      <stop stop-color="#89936a"/><stop offset=".5" stop-color="#a29a70"/><stop offset="1" stop-color="#75825b"/>
    </linearGradient>
    <pattern id="earth" width="83" height="71" patternUnits="userSpaceOnUse">
      <rect width="83" height="71" fill="url(#soil)"/>
      <path d="M0 14 Q23 7 42 14 T83 13 M0 58 Q23 51 42 58 T83 57" fill="none" stroke="#cec29a" stroke-opacity=".16" stroke-width="3"/>
      <circle cx="12" cy="34" r="1.3" fill="#e1d3a7" opacity=".36"/><circle cx="61" cy="43" r="1.8" fill="#4e583c" opacity=".3"/><circle cx="72" cy="8" r="1" fill="#e5d8b2" opacity=".3"/>
    </pattern>
    <radialGradient id="crown" cx="40%" cy="35%" r="68%"><stop stop-color="#87964c"/><stop offset=".55" stop-color="#566a36"/><stop offset=".83" stop-color="#394d2b"/><stop offset="1" stop-color="#283b25"/></radialGradient>
    <radialGradient id="crownLight" cx="37%" cy="32%" r="70%"><stop stop-color="#a2a45d"/><stop offset=".58" stop-color="#687946"/><stop offset=".87" stop-color="#425632"/><stop offset="1" stop-color="#31452a"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="tree">
      <ellipse cx="4" cy="7" rx="27" ry="23" fill="#263425" opacity=".3" filter="url(#shadow)"/>
      <circle r="25" fill="url(#crown)"/>
      <ellipse cx="-7" cy="-8" rx="12" ry="8" fill="#a2a365" opacity=".34"/>
      <ellipse cx="9" cy="-3" rx="8" ry="11" fill="#93a05a" opacity=".35"/>
      <circle cx="-11" cy="7" r="6" fill="#344a2b" opacity=".53"/>
      <circle cx="5" cy="11" r="8" fill="#40552e" opacity=".4"/>
      <path d="M-2 -1 L1 2 L-1 8" stroke="#796e48" stroke-width="2" opacity=".65"/>
    </g>
  </defs>
  <rect width="1000" height="1000" fill="url(#earth)"/>
  <!-- softly worn service paths between the orchard rows -->
  <g fill="#b8aa7d" opacity=".43">
    <path d="M0 100H1000V133H0zM0 300H1000V333H0zM0 500H1000V533H0zM0 700H1000V733H0zM0 900H1000V933H0z"/>
  </g>
  <g fill="#d3c59a" opacity=".19">
